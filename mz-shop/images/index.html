<!DOCTYPE html>
<html lang="mn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XK Shop</title>
  <meta name="description" content="XK Shop - Jersey, Lifestyle, Shoes">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-950 text-white antialiased">

  <div class="bg-sky-400 text-slate-950 text-center text-sm font-medium py-2">
    🚚 24-72 цагийн дотор хүргэнэ
  </div>

  <header class="sticky top-0 z-50 bg-slate-950/90 backdrop-blur border-b border-slate-800">
    <div class="max-w-6xl mx-auto flex items-center justify-between px-6 py-5">
      <a href="#/" class="text-xl font-bold tracking-tight">XK <span class="text-sky-400">SHOP</span></a>
      <nav class="hidden md:flex gap-8 text-sm">
        <a href="#/" data-cat="Lifestyle" class="hover:text-sky-400 transition">Lifestyle</a>
        <a href="#/" data-cat="Jersey" class="hover:text-sky-400 transition">Jersey</a>
        <a href="#/" data-cat="Shoes" class="hover:text-sky-400 transition">Shoes</a>
      </nav>
      <a href="#/cart" class="flex items-center gap-2 text-sm hover:text-sky-400 transition">
        <span>🛒 Сагс</span>
        <span id="cart-count"
          class="bg-sky-400 text-slate-950 text-xs font-bold px-2 py-1 rounded-full min-w-6 text-center">0</span>
      </a>
    </div>
    <nav class="md:hidden flex justify-center gap-8 text-sm py-3 border-t border-slate-800">
      <a href="#/" data-cat="Lifestyle" class="hover:text-sky-400 transition">Lifestyle</a>
      <a href="#/" data-cat="Jersey" class="hover:text-sky-400 transition">Jersey</a>
      <a href="#/" data-cat="Shoes" class="hover:text-sky-400 transition">Shoes</a>
    </nav>
  </header>

  <div id="app"></div>

  <footer class="border-t border-slate-800 px-6 py-12 mt-10">
    <div class="max-w-6xl mx-auto grid md:grid-cols-3 gap-8 text-sm text-slate-400">
      <div>
        <h4 class="text-white font-semibold mb-2">Хүргэлт</h4>
        <p>24-72 цагийн дотор хүргэнэ.</p>
      </div>
      <div>
        <h4 class="text-white font-semibold mb-2">Холбоо барих</h4>
        <p>Instagram: @xkshop</p>
      </div>
      <div>
        <h4 class="text-white font-semibold mb-2">Төлбөр</h4>
        <p>Дансаар болон QPay-ээр төлнө.</p>
      </div>
    </div>
  </footer>

  <script>
    const PRODUCTS = [
      {
        id: 1, name: "Jersey / CLASSIC / BLACK", category: "Jersey", price: 150000,
        img: "https://avecsport.com/images/thumbs/0041051_focus-classic-jersey-black_1084.jpeg",
        badge: "🔥 Эрэлттэй", sizes: ["S", "M", "L", "XL"],
        desc: "Classic загварын хар jersey. Хөнгөн, амьсгалах чадвартай даавуу."
      },
      {
        id: 2, name: "Jersey / CLASSIC / WHITE", category: "Jersey", price: 150000,
        img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSX9-EmGugs-jvzDhkHjAz4TmEw3lnF_on4MWturcCIvg&s=10",
        sizes: ["S", "M", "L", "XL"],
        desc: "Classic загварын цагаан jersey."
      },
      {
        id: 3, name: "Lifestyle / CAP / SKY", category: "Lifestyle", price: 65000,
        img: "https://shopskylinemerch.com/cdn/shop/files/PhotoRoom-20230809-223731.jpg?v=1692565522&width=1680",
        sizes: ["Free"],
        desc: "Тохируулдаг оосортой, өдөр тутмын малгай."
      },
      {
        id: 4, name: "Shoes / RUNNER / BLACK", category: "Shoes", price: 280000,
        img: "https://images-na.ssl-images-amazon.com/images/I/41e7JKB-8ML._SL500_._AC_SL500_.jpg",
        sizes: ["40", "41", "42", "43", "44"],
        desc: "Өдөр тутам болон спортод зориулсан гутал."
      }
    ];

    // ===== Тохиргоо =====
    const TG_TOKEN = "ЭНД_BOT_TOKEN";
    const TG_CHAT_ID = "ЭНД_CHAT_ID";
    const BANK_INFO = "Хаан банк: 5000000000 (Нэр Овог)"; // өөрийнхөөрөө солино

    // ===== Туслах =====
    const app = document.getElementById("app");
    const fmt = n => n.toLocaleString("en-US") + "₮";
    const imgBox = (p, extra = "") => p.img
      ? `<img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover ${extra}">`
      : `<span class="text-slate-600 text-sm">Зураг удахгүй</span>`;

    // ===== Сагс =====
    let cart = [];
    try { cart = JSON.parse(localStorage.getItem("xk-cart")) || []; } catch (e) { }

    function saveCart() {
      try { localStorage.setItem("xk-cart", JSON.stringify(cart)); } catch (e) { }
      document.getElementById("cart-count").textContent = cart.reduce((s, i) => s + i.qty, 0);
    }

    function addToCart(id, size, qty) {
      const item = cart.find(i => i.id === id && i.size === size);
      if (item) item.qty += qty; else cart.push({ id, size, qty });
      saveCart();
    }

    // ===== Захиалга илгээх =====
    async function sendOrder(order) {
      const lines = order.items
        .map(i => `• ${i.name} (${i.size}) × ${i.qty} = ${fmt(i.sum)}`)
        .join("\n");
      const text =
        `🛒 Шинэ захиалга ${order.no}\n\n` +
        `👤 ${order.name}\n📞 ${order.phone}\n📍 ${order.address}\n\n` +
        `${lines}\n\n💰 Нийт: ${fmt(order.total)}`;

      const res = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: TG_CHAT_ID, text })
      });
      if (!res.ok) throw new Error("Илгээж чадсангүй");
    }

    // ===== Нүүр хуудас =====
    let activeCat = "";

    function viewHome() {
      const list = PRODUCTS.filter(p => !activeCat || p.category === activeCat);
      const cats = [["Jersey", "👕"], ["Lifestyle", "🧢"], ["Shoes", "👟"]];

      app.innerHTML = `
        <section class="bg-sky-200 text-slate-900 text-center py-20 md:py-28 px-6">
          <p class="text-sm font-semibold tracking-widest">XKUZZX SHOP</p>
          <h1 class="text-4xl md:text-6xl font-extrabold mt-4 leading-tight">PLAY HARD &amp; DRIP HARDER</h1>
          <button id="shop-btn" class="mt-8 bg-slate-950 text-white px-8 py-3 rounded-full hover:bg-sky-600 transition">
            Дэлгүүр хэсэх
          </button>
        </section>

        <section class="bg-slate-800 py-8 px-6">
          <div class="flex flex-wrap justify-center gap-10 md:gap-16 text-center text-sm font-semibold">
            ${cats.map(([c, e]) => `
              <button data-cat="${c}" class="group">
                <div class="text-4xl mb-2 group-hover:scale-110 transition">${e}</div>
                <span class="${activeCat === c ? "text-sky-400" : ""}">${c}</span>
              </button>`).join("")}
          </div>
        </section>

        <main id="products" class="max-w-6xl mx-auto px-6 py-14">
          <div class="flex items-center justify-between mb-8">
            <h2 class="text-2xl font-bold text-sky-400">${activeCat || "Онцлох"}</h2>
            ${activeCat ? `<button id="clear-cat" class="text-sm text-slate-400 hover:text-sky-400">Бүгдийг харах</button>` : ""}
          </div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            ${list.map(p => `
              <a href="#/product/${p.id}" class="group block">
                <div class="relative aspect-square overflow-hidden rounded-xl bg-slate-800 flex items-center justify-center">
                  ${imgBox(p, "group-hover:opacity-70 transition")}
                  ${p.badge ? `<span class="absolute top-3 right-3 bg-sky-400 text-slate-900 text-xs font-semibold px-3 py-1 rounded-full">${p.badge}</span>` : ""}
                </div>
                <h3 class="mt-4 text-sm">${p.name}</h3>
                <p class="text-sky-400 text-sm mt-1">${fmt(p.price)}</p>
              </a>`).join("")}
          </div>
        </main>`;

      document.getElementById("shop-btn").onclick = () =>
        document.getElementById("products").scrollIntoView({ behavior: "smooth" });
      app.querySelectorAll("button[data-cat]").forEach(b => b.onclick = () => {
        activeCat = b.dataset.cat; viewHome();
        document.getElementById("products").scrollIntoView({ behavior: "smooth" });
      });
      const clear = document.getElementById("clear-cat");
      if (clear) clear.onclick = () => { activeCat = ""; viewHome(); };
    }

    // ===== Бүтээгдэхүүний хуудас =====
    function viewProduct(id) {
      const p = PRODUCTS.find(x => x.id === id);
      if (!p) {
        app.innerHTML = `<main class="max-w-6xl mx-auto px-6 py-10">
          <p class="text-slate-400">Бүтээгдэхүүн олдсонгүй.</p>
          <a href="#/" class="inline-block mt-4 text-sky-400">Нүүр хуудас руу очих</a></main>`;
        return;
      }
      let size = p.sizes[0], qty = 1;

      app.innerHTML = `
        <main class="max-w-6xl mx-auto px-6 py-10">
          <a href="#/" class="text-sm text-slate-400 hover:text-sky-400 transition">← Буцах</a>
          <div class="grid md:grid-cols-2 gap-10 mt-6">
            <div class="relative aspect-square overflow-hidden rounded-xl bg-slate-800 flex items-center justify-center">
              ${imgBox(p)}
              ${p.badge ? `<span class="absolute top-3 right-3 bg-sky-400 text-slate-900 text-xs font-semibold px-3 py-1 rounded-full">${p.badge}</span>` : ""}
            </div>
            <div>
              <p class="text-sm text-slate-400">${p.category}</p>
              <h1 class="text-3xl font-bold mt-1">${p.name}</h1>
              <p class="text-sky-400 text-2xl mt-3">${fmt(p.price)}</p>
              <p class="text-slate-300 text-sm mt-5 leading-relaxed">${p.desc}</p>

              <p class="text-sm font-semibold mt-8 mb-3">Размер</p>
              <div id="sizes" class="flex flex-wrap gap-2"></div>

              <p class="text-sm font-semibold mt-8 mb-3">Тоо ширхэг</p>
              <div class="inline-flex items-center border border-slate-700 rounded-full">
                <button id="minus" class="px-4 py-2 hover:text-sky-400">−</button>
                <span id="qty" class="w-8 text-center">1</span>
                <button id="plus" class="px-4 py-2 hover:text-sky-400">+</button>
              </div>

              <button id="add" class="block w-full md:w-auto mt-8 bg-sky-400 text-slate-950 font-semibold px-10 py-3 rounded-full hover:bg-sky-300 transition">
                Сагсанд нэмэх
              </button>
              <p id="msg" class="text-sm text-sky-400 mt-3 h-5"></p>
              <div class="mt-6 border-t border-slate-800 pt-5 text-sm text-slate-400">🚚 24-72 цагийн дотор хүргэнэ.</div>
            </div>
          </div>
        </main>`;

      const sizesEl = document.getElementById("sizes");
      const renderSizes = () => {
        sizesEl.innerHTML = "";
        p.sizes.forEach(s => {
          const b = document.createElement("button");
          b.textContent = s;
          b.className = "min-w-12 px-4 py-2 rounded-full border text-sm transition " +
            (s === size ? "bg-sky-400 text-slate-950 border-sky-400" : "border-slate-700 hover:border-sky-400");
          b.onclick = () => { size = s; renderSizes(); };
          sizesEl.appendChild(b);
        });
      };
      renderSizes();

      const qtyEl = document.getElementById("qty");
      document.getElementById("minus").onclick = () => { if (qty > 1) qty--; qtyEl.textContent = qty; };
      document.getElementById("plus").onclick = () => { if (qty < 10) qty++; qtyEl.textContent = qty; };

      const msg = document.getElementById("msg");
      document.getElementById("add").onclick = () => {
        addToCart(p.id, size, qty);
        msg.textContent = "Сагсанд нэмэгдлээ ✓";
        setTimeout(() => (msg.textContent = ""), 2000);
      };
    }

    // ===== Сагсны хуудас =====
    function viewCart() {
      cart = cart.filter(i => PRODUCTS.some(p => p.id === i.id));
      saveCart();

      if (cart.length === 0) {
        app.innerHTML = `
          <main class="max-w-6xl mx-auto px-6 py-10">
            <h1 class="text-2xl font-bold text-sky-400 mb-8">Миний сагс</h1>
            <div class="text-center py-20">
              <p class="text-slate-400">Таны сагс хоосон байна.</p>
              <a href="#/" class="inline-block mt-6 bg-sky-400 text-slate-950 font-semibold px-8 py-3 rounded-full hover:bg-sky-300 transition">Дэлгүүр хэсэх</a>
            </div>
          </main>`;
        return;
      }

      let total = 0;
      const rows = cart.map((item, idx) => {
        const p = PRODUCTS.find(x => x.id === item.id);
        const sum = p.price * item.qty;
        total += sum;
        return `
          <div class="flex gap-4 py-5 border-b border-slate-800">
            <div class="w-24 h-24 shrink-0 rounded-xl bg-slate-800 overflow-hidden flex items-center justify-center">
              ${p.img ? `<img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover">` : `<span class="text-slate-600 text-xs">Зураг</span>`}
            </div>
            <div class="flex-1">
              <a href="#/product/${p.id}" class="text-sm hover:text-sky-400">${p.name}</a>
              <p class="text-xs text-slate-400 mt-1">Размер: ${item.size}</p>
              <p class="text-sky-400 text-sm mt-1">${fmt(p.price)}</p>
              <div class="flex items-center gap-4 mt-3">
                <div class="inline-flex items-center border border-slate-700 rounded-full text-sm">
                  <button data-act="minus" data-i="${idx}" class="px-3 py-1 hover:text-sky-400">−</button>
                  <span class="w-6 text-center">${item.qty}</span>
                  <button data-act="plus" data-i="${idx}" class="px-3 py-1 hover:text-sky-400">+</button>
                </div>
                <button data-act="remove" data-i="${idx}" class="text-xs text-slate-400 hover:text-red-400">Устгах</button>
              </div>
            </div>
            <p class="text-sm font-semibold">${fmt(sum)}</p>
          </div>`;
      }).join("");

      const inputCls = "w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-sky-400";
      app.innerHTML = `
        <main class="max-w-6xl mx-auto px-6 py-10">
          <h1 class="text-2xl font-bold text-sky-400 mb-8">Миний сагс</h1>
          <div class="grid md:grid-cols-3 gap-10">
            <div class="md:col-span-2">${rows}</div>
            <div class="bg-slate-900 rounded-xl p-6 h-fit">
              <div class="flex justify-between text-sm">
                <span class="text-slate-400">Нийт дүн</span>
                <span class="text-sky-400 font-bold text-lg">${fmt(total)}</span>
              </div>
              <form id="order-form" class="mt-6 space-y-3">
                <input required name="name" placeholder="Нэр" class="${inputCls}">
                <input required name="phone" type="tel" placeholder="Утасны дугаар" class="${inputCls}">
                <textarea required name="address" rows="3" placeholder="Хүргэлтийн хаяг" class="${inputCls}"></textarea>
                <button type="submit" class="w-full bg-sky-400 text-slate-950 font-semibold py-3 rounded-full hover:bg-sky-300 transition disabled:opacity-60">Захиалах</button>
              </form>
            </div>
          </div>
        </main>`;

      app.querySelectorAll("[data-act]").forEach(btn => btn.onclick = () => {
        const i = Number(btn.dataset.i);
        if (btn.dataset.act === "plus" && cart[i].qty < 10) cart[i].qty++;
        if (btn.dataset.act === "minus" && cart[i].qty > 1) cart[i].qty--;
        if (btn.dataset.act === "remove") cart.splice(i, 1);
        saveCart(); viewCart();
      });

      document.getElementById("order-form").onsubmit = async e => {
        e.preventDefault();
        const f = new FormData(e.target);
        const phone = String(f.get("phone")).replace(/\s/g, "");
        if (!/^\d{8}$/.test(phone)) {
          alert("Утасны дугаар 8 оронтой байх ёстой.");
          return;
        }

        const btn = e.target.querySelector("button[type=submit]");
        btn.disabled = true;
        btn.textContent = "Илгээж байна...";

        const order = {
          no: "XK-" + Date.now().toString().slice(-5),
          name: f.get("name"),
          phone,
          address: f.get("address"),
          total,
          items: cart.map(i => {
            const p = PRODUCTS.find(x => x.id === i.id);
            return { name: p.name, size: i.size, qty: i.qty, sum: p.price * i.qty };
          })
        };

        try {
          await sendOrder(order);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = "Захиалах";
          alert("Алдаа гарлаа. Дахин оролдоно уу эсвэл Instagram-аар холбогдоно уу.");
          return;
        }

        cart = []; saveCart();
        app.innerHTML = `
          <main class="max-w-6xl mx-auto px-6 py-20 text-center">
            <p class="text-4xl">✅</p>
            <h2 class="text-xl font-bold mt-4">Захиалга хүлээн авлаа</h2>
            <p class="text-sky-400 font-semibold mt-2">Захиалгын дугаар: ${order.no}</p>
            <div class="bg-slate-900 rounded-xl p-5 mt-6 inline-block text-sm text-left">
              <p class="text-slate-400">Төлөх дүн</p>
              <p class="text-sky-400 text-xl font-bold">${fmt(order.total)}</p>
              <p class="text-slate-400 mt-4">Дансны мэдээлэл</p>
              <p>${BANK_INFO}</p>
              <p class="text-slate-400 mt-3 text-xs">Гүйлгээний утга дээр <b>${order.no}</b> гэж бичнэ үү.</p>
            </div>
            <div><a href="#/" class="inline-block mt-6 text-sky-400">Нүүр хуудас руу буцах</a></div>
          </main>`;
      };
    }

    // ===== Чиглүүлэгч =====
    function route() {
      const h = location.hash || "#/";
      if (h.startsWith("#/product/")) viewProduct(Number(h.split("/")[2]));
      else if (h === "#/cart") viewCart();
      else viewHome();
      if (h !== "#/") window.scrollTo(0, 0);
    }

    // Дээд цэсний ангилал (desktop + mobile хоёулаа)
    document.querySelectorAll("nav [data-cat]").forEach(a => a.addEventListener("click", () => {
      activeCat = a.dataset.cat;
      if ((location.hash || "#/") === "#/") {
        viewHome();
        document.getElementById("products").scrollIntoView({ behavior: "smooth" });
      }
    }));

    window.addEventListener("hashchange", route);
    saveCart();
    route();
  </script>

</body>

</html>
